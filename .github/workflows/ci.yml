name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  deterministic-tests:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Parse every PowerShell script
        shell: pwsh
        run: |
          $failed = @()
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if (@($errors).Count) {
              $failed += "${($_.FullName)}: $(@($errors).Message -join '; ')"
            }
          }
          if ($failed.Count) { throw ($failed -join [Environment]::NewLine) }

      - name: Parse every PowerShell script — Windows PowerShell 5.1
        shell: powershell
        run: |
          $failed = @()
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if (@($errors).Count) {
              $failed += "${($_.FullName)}: $(@($errors).Message -join '; ')"
            }
          }
          if ($failed.Count) { throw ($failed -join [Environment]::NewLine) }

      - name: Validate JSON evidence
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter *.json | ForEach-Object {
            Get-Content -LiteralPath $_.FullName -Raw | ConvertFrom-Json | Out-Null
          }

      - name: Fan policy simulations
        shell: pwsh
        run: .\tests\Test-AcerAdaptiveFanController.ps1

      - name: Watchdog fail-closed probes
        shell: pwsh
        run: .\tests\Test-AcerFanWatchdog.ps1

      - name: Watchdog fail-closed probes — Windows PowerShell 5.1
        shell: powershell
        run: .\tests\Test-AcerFanWatchdog.ps1

      - name: CRUWBlocker preflight invariant tests
        shell: pwsh
        run: .\tests\Test-CRUWBlockerPreflightCore.ps1

      - name: CRUWBlocker preflight invariant tests — Windows PowerShell 5.1
        shell: powershell
        run: .\tests\Test-CRUWBlockerPreflightCore.ps1

      - name: Recovery-facilities preparer rejects missing confirmation
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $expectedMessage = 'Explicit -ConfirmTemporaryRecoveryEnablement is required'
          $pwshOutput = (& pwsh -NoProfile -File .\src\powershell\maintenance\Prepare-CRUWRecoveryFacilities.ps1 2>&1 | Out-String)
          $pwshExitCode = $LASTEXITCODE
          if ($pwshExitCode -eq 0 -or $pwshOutput -notmatch [regex]::Escape($expectedMessage)) {
            throw "PowerShell 7 recovery-facilities guard failed: exit=$pwshExitCode"
          }
          $windowsPowerShellOutput = (& powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\src\powershell\maintenance\Prepare-CRUWRecoveryFacilities.ps1 2>&1 | Out-String)
          $windowsPowerShellExitCode = $LASTEXITCODE
          if ($windowsPowerShellExitCode -eq 0 -or $windowsPowerShellOutput -notmatch [regex]::Escape($expectedMessage)) {
            throw "Windows PowerShell recovery-facilities guard failed: exit=$windowsPowerShellExitCode"
          }
          Write-Host "PASS: recovery-facilities guard rejected missing confirmation in both engines"
          exit 0

      - name: CRUWBlocker transaction simulations — PowerShell 7
        shell: pwsh
        run: .\tests\Test-CRUWStateMachine.Simulated.ps1

      - name: CRUWBlocker transaction simulations — Windows PowerShell 5.1
        shell: powershell
        run: .\tests\Test-CRUWStateMachine.Simulated.ps1

      - name: CRUWBlocker cross-engine journal — PowerShell 7 host
        shell: pwsh
        run: .\tests\Test-CRUWCrossEngineJournal.ps1

      - name: CRUWBlocker cross-engine journal — Windows PowerShell 5.1 host
        shell: powershell
        run: .\tests\Test-CRUWCrossEngineJournal.ps1

      - name: Reject unsafe CRUW removal primitives
        shell: pwsh
        run: |
          $paths = @(
            '.\src\powershell\maintenance\CRUWStateMachine.Common.ps1',
            '.\src\powershell\maintenance\Invoke-CRUWBlockerRemoval.ps1',
            '.\src\powershell\maintenance\Repair-CRUWInterruptedRemoval.ps1',
            '.\src\powershell\maintenance\Test-CRUWBlockerPostboot.ps1'
          )
          foreach ($path in $paths) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required CRUW transaction source missing: $path"
            }
          }
          $source = ($paths | ForEach-Object { Get-Content -LiteralPath $_ -Raw }) -join "`n"
          $forbidden = [ordered]@{
            force = '(?i)/force'
            reboot = '(?i)Restart-Computer|shutdown\.exe|shutdown\.com'
            manualRegistryOrServiceDelete = '(?i)Remove-ItemProperty|Set-ItemProperty|New-ItemProperty|reg\.exe\s+(?:add|delete)|sc\.exe\s+(?:delete|stop)'
          }
          foreach ($rule in $forbidden.GetEnumerator()) {
            if ($source -match $rule.Value) { throw "Unsafe CRUW primitive detected: $($rule.Key)" }
          }
          $repairTokens = $null
          $repairErrors = $null
          $repairAst = [Management.Automation.Language.Parser]::ParseFile(
            '.\src\powershell\maintenance\Repair-CRUWInterruptedRemoval.ps1',
            [ref]$repairTokens,
            [ref]$repairErrors
          )
          $repairAdapterCalls = @($repairAst.FindAll({
            param($node)
            return $node -is [Management.Automation.Language.CommandAst] -and
              $node.GetCommandName() -ieq 'Invoke-CRUWAdapter'
          }, $true))
          $repairDynamicAdapterCalls = @($repairAdapterCalls | Where-Object {
            $_.CommandElements.Count -lt 3 -or
              -not ($_.CommandElements[2] -is [Management.Automation.Language.StringConstantExpressionAst])
          })
          if ($repairDynamicAdapterCalls.Count) {
            throw 'Recovery adapter operation names must be literal so delete replay cannot evade static review'
          }
          $repairDeleteCalls = @($repairAdapterCalls | Where-Object {
            [string]$_.CommandElements[2].Value -ieq 'DeleteDriver'
          })
          if ($repairDeleteCalls.Count) {
            throw 'Recovery entrypoint must never replay driver deletion'
          }
          $entrypointPaths = @(
            '.\src\powershell\maintenance\Invoke-CRUWBlockerRemoval.ps1',
            '.\src\powershell\maintenance\Repair-CRUWInterruptedRemoval.ps1',
            '.\src\powershell\maintenance\Test-CRUWBlockerPostboot.ps1'
          )
          $nativeMutationCommands = @('Suspend-BitLocker','Resume-BitLocker','pnputil','pnputil.exe','reagentc','reagentc.exe','Disable-ComputerRestore')
          foreach ($entrypointPath in $entrypointPaths) {
            $tokens = $null
            $errors = $null
            $ast = [Management.Automation.Language.Parser]::ParseFile($entrypointPath, [ref]$tokens, [ref]$errors)
            $bypasses = @($ast.FindAll({
              param($node)
              $node -is [Management.Automation.Language.CommandAst] -and
                $nativeMutationCommands -contains $node.GetCommandName()
            }, $true))
            if ($bypasses.Count) {
              throw "Boot-critical entrypoint bypasses sealed adapter: $entrypointPath"
            }
          }

      - name: Sanitized exporter tests — PowerShell 7
        shell: pwsh
        run: .\tests\Test-ExportSanitizedBaseline.ps1

      - name: Sanitized exporter tests — Windows PowerShell 5.1
        shell: powershell
        run: .\tests\Test-ExportSanitizedBaseline.ps1

      - name: Limit telemetry tests — PowerShell 7
        shell: pwsh
        run: .\tests\Test-InvokeLimitTelemetry.ps1

      - name: Limit telemetry tests — Windows PowerShell 5.1
        shell: powershell
        run: .\tests\Test-InvokeLimitTelemetry.ps1

      - name: Limit telemetry forbidden-command AST gate
        shell: pwsh
        run: .\tests\Test-LimitTelemetryForbiddenCommands.ps1

      - name: Validate pinned release hashes
        shell: pwsh
        run: .\src\powershell\fan\Deploy-SecureAcerFanUpdate.ps1 -ValidateOnly

      - name: Reject accidental local identity and secret patterns
        shell: pwsh
        run: |
          $patterns = @(
            'C:\\Users\\soled',
            ('soledad' + 'ortega'),
            'SCSI\\Disk',
            'gho_[A-Za-z0-9]+',
            '-----BEGIN (?:RSA |OPENSSH |EC )?PRIVATE KEY-----',
            '\b\d{6}(?:-\d{6}){7}\b'
          )
          $files = Get-ChildItem -Recurse -File | Where-Object {
            $_.FullName -notmatch '[\\/]\.git[\\/]' -and
            $_.Name -notin @('Test-ExportSanitizedBaseline.ps1')
          }
          foreach ($pattern in $patterns) {
            $matches = $files | Select-String -Pattern $pattern -CaseSensitive:$false
            if ($matches) { throw "Sensitive pattern '$pattern' found: $($matches.Path -join ', ')" }
          }
